<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Onboarding 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

<div class="container" style="max-width: 400px;">

<div class="passos"><span class="feito"></span><span class=""></span><span class=""></span><span class=""></span></div>
<h2 class="mb-1">Sobre sua família</h2>
<p class="text-muted mb-4">Passo 1 de 4 · Só o básico para começar.</p>
<form id="form-onb1" action="onboarding-resp-2.html">
    <div class="mb-3">
    <label class="form-label text-marrom">Nome da família</label>
    <input type="text" class="form-control form-control-custom" placeholder="Ex.: Família Silva" required>
</div>
    <div class="mb-3">
    <label class="form-label text-marrom">Seu nome</label>
    <input type="text" class="form-control form-control-custom" placeholder="Ex.: João" required>
</div>
    <div class="mb-4">
        <label class="form-label text-marrom">Quantos filhos vão usar o app?</label>
        <select class="form-select form-control-custom">
            <option>1 filho</option><option>2 filhos</option><option>3 filhos</option><option>4 ou mais</option>
        </select>
    </div>
    <button type="submit" class="btn btn-laranja">CONTINUAR</button>
</form>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/paginas.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Tutorial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

<div class="container" style="max-width: 400px;">

<div class="passos"><span class="feito"></span><span class="feito"></span><span class=""></span></div>
<h2 class="mb-4 text-center">Como funciona?</h2>
<div id="tutorial" class="carousel slide mb-4" data-bs-interval="false">
    <div class="carousel-inner text-center">
        <div class="carousel-item active">
            <div class="card-bege py-5"><div style="font-size: 4rem;">💸</div>
            <h4 class="mt-3">Registre seus gastos</h4><p class="mb-0 px-3">Gastou? Anote em menos de 10 segundos e veja o efeito na sua meta.</p></div>
        </div>
        <div class="carousel-item">
            <div class="card-bege py-5"><div style="font-size: 4rem;">🎧</div>
            <h4 class="mt-3">Acompanhe sua meta</h4><p class="mb-0 px-3">A barra mostra o quanto falta para você conquistar o que quer.</p></div>
        </div>
        <div class="carousel-item">
            <div class="card-bege py-5"><div style="font-size: 4rem;">🔥</div>
            <h4 class="mt-3">Mantenha a sequência</h4><p class="mb-0 px-3">Todo dia que você faz o check-in, sua sequência cresce.</p></div>
        </div>
    </div>
    <div class="d-flex justify-content-center gap-2 mt-3">
        <button class="btn btn-sm btn-outline-marrom" style="width:auto" data-bs-target="#tutorial" data-bs-slide="prev">‹</button>
        <button class="btn btn-sm btn-outline-marrom" style="width:auto" data-bs-target="#tutorial" data-bs-slide="next">›</button>
    </div>
</div>
<button class="btn btn-laranja" onclick="redirecionar('onboarding-filho-3.html')">ENTENDI!</button>
</div>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Filho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4 com-menu">

    <div class="container text-center" style="max-width: 400px;">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 px-2">
            <h3 id="nome" class="mb-0">Oi, John</h3>
            <div class="fs-5">
                <a href="notificacoes.html" class="text-decoration-none">🔔</a>
            </div>
        </div>

        <!-- Gráfico de Progresso (anel preenchido com a porcentagem vinda da API) -->
        <a href="minha-meta.html" class="d-inline-block mb-3 text-decoration-none text-reset">
            <div id="anel-meta" class="rounded-circle d-flex align-items-center justify-content-center"
                 style="--pct: 42; width: 200px; height: 200px; background: conic-gradient(#2ecc71 calc(var(--pct) * 1%), #e5dcc8 0);">
                <div class="rounded-circle d-flex flex-column align-items-center justify-content-center"
                     style="width: 164px; height: 164px; background: var(--bg-creme);">
                    <h1 id="meta-icone" class="mb-0">🎧</h1>
                    <h4 id="meta-pct" class="fw-bold mb-0 text-success">42%</h4>
                </div>
            </div>
        </a>

        <p id="meta-valores" class="text-marrom fw-bold">R$ 420,00 de R$ 900,00</p>

        <!-- Cards de Saldo -->
        <div class="row g-2 mb-4 px-2">
            <div class="col-6">
                <div class="card-saldo">
                    <h5>Saldo Atual</h5>
                    <p id="saldo">R$ X,00</p>
                </div>
            </div>
            <div class="col-6">
                <div class="card-saldo">
                    <h5>Esta Semana</h5>
                    <p id="semana">R$ XX,00</p>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center px-2 mb-3">
            <span id="streak" class="selo selo-laranja fs-6">🔥 12 dias seguidos</span>
            <a id="btn-checkin" href="checkin-diario.html" class="selo selo-marrom fs-6 text-decoration-none">✔ Check-in do dia</a>
        </div>

        <div class="px-2">
            <button class="btn btn-laranja" onclick="redirecionar('registrar-gasto.html')">REGISTRAR GASTO</button>
        </div>
    </div>


    <nav class="menu-inferior"><div class="itens">
        <a href="dashboard-filho.html" class="ativo"><span class="ico">🏠</span>Início</a>
        <a href="meu-extrato.html"><span class="ico">📄</span>Extrato</a>
        <a href="missoes.html"><span class="ico">🎯</span>Missões</a>
        <a href="conquistas.html"><span class="ico">🏆</span>Conquistas</a>
        <a href="perfil-filho.html"><span class="ico">👤</span>Perfil</a>
    </div></nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/paginas.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Aprovação da Meta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

<div class="container" style="max-width: 400px;">

<div class="topbar">
    <a href="central-aprovacoes.html" class="voltar">←</a>
    <h4>Aprovar meta</h4>
    
</div>
<div class="card-bege text-center py-4">
    <div style="font-size: 3.5rem;">🎧</div>
    <h3 class="mb-0">Fone de ouvido</h3>
    <p class="text-muted mb-0">Sugerida por John</p>
</div>
<div class="row g-2 mb-3">
    <div class="col-6"><div class="card-saldo"><h5>Valor</h5><p>R$ 900,00</p></div></div>
    <div class="col-6"><div class="card-saldo"><h5>Prazo</h5><p>10 meses</p></div></div>
</div>
<div class="card-toca"><small class="text-muted">Previsão com a regra atual (50% para guardar)</small>
    <p class="mb-0 fw-bold text-marrom">Ele guarda R$ 75/mês → atinge a meta em 12 meses.</p></div>
<div class="alert alert-warning">⚠️ Com a regra atual, ele não chega no prazo. Você pode ajustar o valor ou dar um bônus.</div>
<div class="mb-3">
    <label class="form-label text-marrom">Ajustar valor da meta (opcional)</label>
    <input type="text" class="form-control form-control-custom dinheiro" placeholder="900,00" inputmode="decimal">
</div>
<div class="d-grid gap-2">
    <button class="btn btn-verde" data-acao="aprovar">APROVAR META</button>
    <button class="btn btn-outline-marrom" data-acao="ajustar">APROVAR COM VALOR AJUSTADO</button>
    <button class="btn btn-vermelho-outline" data-acao="recusar">RECUSAR</button>
</div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/paginas.js"></script>
</body>
</html>

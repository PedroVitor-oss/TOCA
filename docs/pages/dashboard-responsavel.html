<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Responsável</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4 com-menu">

    <div class="container" style="max-width: 400px;">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 px-2">
            <h3 id="nome" class="mb-0">Olá, João</h3>
            <div class="fs-5">
                <a href="notificacoes.html" class="text-decoration-none">🔔</a>
            </div>
        </div>

        <!-- Cards de Saldo -->
        <div class="row g-2 mb-4 px-2">
            <div class="col-6">
                <div class="card-saldo">
                    <h5>Saldo</h5>
                    <p id="saldo">R$ 1200,00</p>
                </div>
            </div>
            <div class="col-6">
                <div class="card-saldo">
                    <h5>Já gasto</h5>
                    <p id="gasto">R$ 200,00</p>
                </div>
            </div>
        </div>

        <div class="px-2">

            <button class="btn btn-laranja mb-2" onclick="redirecionar('registrar-gasto-familiar.html')">ADICIONAR GASTO</button>
            <button class="btn btn-verde mb-2 w-100" onclick="redirecionar('registrar-entrada-pai.html')">ADICIONAR ENTRADA (PAI)</button>
            <button class="btn btn-azul mb-4 w-100" onclick="redirecionar('registrar-mesada-crianca.html')">ADICIONAR MESADA</button>

            <h5 class="fw-bold mb-3 text-marrom">Atalhos Rápidos</h5>
            <div class="d-flex justify-content-between mb-4 text-center">
                <a href="extrato-familiar.html" class="text-decoration-none text-reset"><div class="bg-white p-2 rounded-3 border">📄</div><small>Extrato</small></a>
                <a href="metas-filho.html" class="text-decoration-none text-reset"><div class="bg-white p-2 rounded-3 border">📈</div><small>Meta</small></a>
                <a href="painel-filho.html" class="text-decoration-none text-reset"><div class="bg-white p-2 rounded-3 border">👨‍👩‍👧</div><small>Filhos</small></a>
                <a href="perfil-responsavel.html" class="text-decoration-none text-reset"><div class="bg-white p-2 rounded-3 border">👤</div><small>Perfil</small></a>
            </div>

            <h5 class="fw-bold mb-3 text-marrom">O que você precisa?</h5>
            <input type="text" class="form-control form-control-custom mb-4" placeholder="Pesquisar...">

            <h5 class="fw-bold mb-3 text-marrom">Notificações</h5>
            <a href="central-aprovacoes.html" class="text-decoration-none">
                <div class="p-3 rounded-3 mb-2 text-white" style="background-color: #2e8b57;"><strong>Economia da semana guardada!</strong><br><small>John guardou R$ 75,00</small></div>
            </a>
            <a href="central-aprovacoes.html" class="text-decoration-none">
                <div class="p-3 rounded-3 mb-2 text-white" style="background-color: var(--marrom-escuro);"><strong>Confirmar gasto de R$ 50,00</strong><br><small>Pedido aguardando sua aprovação</small></div>
            </a>
        </div>
    </div>


    <nav class="menu-inferior"><div class="itens">
        <a href="dashboard-responsavel.html" class="ativo"><span class="ico">🏠</span>Início</a>
        <a href="extrato-familiar.html"><span class="ico">📄</span>Extrato</a>
        <a href="central-aprovacoes.html"><span class="ico">✅</span>Aprovações</a>
        <a href="painel-filho.html"><span class="ico">🧒</span>Filho</a>
        <a href="perfil-responsavel.html"><span class="ico">👤</span>Perfil</a>
    </div></nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/paginas.js"></script>
</body>
</html>

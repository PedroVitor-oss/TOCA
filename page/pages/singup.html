<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-5">

    <div class="container" style="max-width: 400px;">
        <h2 class="text-center mb-4">Vamos montar<br>sua conta</h2>

        <form action="onboarding-filho-2.html" class="px-3">
            <div class="mb-2">
                <label class="form-label text-marrom">Nome</label>
                <input type="text" class="form-control form-control-custom" required>
            </div>
            <div class="mb-2">
                <label class="form-label text-marrom">Apelido (opcional)</label>
                <input type="text" class="form-control form-control-custom">
            </div>
            <div class="mb-2">
                <label class="form-label text-marrom">E-mail</label>
                <input type="email" class="form-control form-control-custom" required>
            </div>
            <div class="mb-2">
                <label class="form-label text-marrom">Código de convite</label>
                <input type="text" class="form-control form-control-custom" placeholder="TOCA-XXXXX" required>
            </div>
            <div class="mb-2">
                <label class="form-label text-marrom">Senha</label>
                <input type="password" class="form-control form-control-custom" required>
            </div>
            
            <div class="mb-3 mt-3">
                <label class="form-label text-marrom fw-bold">Seu avatar</label>
                <div class="d-flex gap-2 flex-wrap" data-grupo>
                    <span class="avatar-opcao ativo">🦊</span><span class="avatar-opcao">🐺</span><span class="avatar-opcao">🐻</span><span class="avatar-opcao">🦝</span>
                    <span class="avatar-opcao">🦁</span><span class="avatar-opcao">🐱</span><span class="avatar-opcao">🐼</span><span class="avatar-opcao">🐯</span>
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="termos" required>
                <label class="form-check-label text-marrom" for="termos">
                    Concordo com os <a href="#" class="text-marrom">Termos de Uso</a>
                </label>
            </div>

            <button type="submit" class="btn btn-laranja">CRIAR CONTA</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>

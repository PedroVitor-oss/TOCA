<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Configurar Mesada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

<div class="container" style="max-width: 400px;">

<div class="topbar">
    <a href="perfil-responsavel.html" class="voltar">←</a>
    <h4>Mesada</h4>
    
</div>
<form>
    <div class="mb-3">
    <label class="form-label text-marrom">Valor da mesada (R$)</label>
    <input type="text" class="form-control form-control-custom dinheiro" placeholder="" value="150,00" inputmode="decimal">
</div>
    <div class="mb-3"><label class="form-label text-marrom">Periodicidade</label>
        <div class="d-flex gap-2" data-grupo><span class="chip-opcao">Semanal</span><span class="chip-opcao">Quinzenal</span><span class="chip-opcao ativo">Mensal</span></div></div>
    <div class="mb-4"><label class="form-label text-marrom">Dia do pagamento</label>
        <select class="form-select form-control-custom"><option>Dia 1</option><option selected>Dia 5</option><option>Dia 10</option><option>Dia 15</option></select></div>
    <button type="button" class="btn btn-laranja"  data-destino="sucesso.html?titulo=Mesada%20atualizada&msg=O%20novo%20valor%20vale%20a%20partir%20do%20pr%C3%B3ximo%20pagamento.&destino=perfil-responsavel.html">SALVAR</button>
</form>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/paginas.js"></script>
</body>
</html>

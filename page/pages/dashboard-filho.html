<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Filho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

    <div class="container text-center" style="max-width: 400px;">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 px-2">
            <h3 class="mb-0">Oi, John</h3>
            <div class="fs-5">
                <span>🔔</span>
                <span>🔍</span>
            </div>
        </div>

        <!-- Gráfico de Progresso (Simulado com CSS) -->
        <div class="position-relative d-inline-block mb-3">
            <div class="rounded-circle border border-5 border-light d-flex align-items-center justify-content-center" 
                 style="width: 200px; height: 200px; border-color: #2ecc71 !important; border-left-color: #eee !important; border-bottom-color: #eee !important; transform: rotate(-45deg);">
                <div style="transform: rotate(45deg);">
                    <h1>🎧</h1>
                </div>
            </div>
            <div class="position-absolute top-50 start-50 translate-middle w-100 mt-5">
                <h4 class="fw-bold mb-0">42%</h4>
            </div>
        </div>

        <p class="text-marrom fw-bold">R$ 420,00 de R$ 900,00</p>

        <!-- Cards de Saldo -->
        <div class="row g-2 mb-4 px-2">
            <div class="col-6">
                <div class="card-saldo">
                    <h5>Saldo Atual</h5>
                    <p>R$ X,00</p>
                </div>
            </div>
            <div class="col-6">
                <div class="card-saldo">
                    <h5>Esta Semana</h5>
                    <p>R$ XX,00</p>
                </div>
            </div>
        </div>

        <div class="px-2">
            <button class="btn btn-laranja" onclick="redirecionar('registrar-gasto.html')">REGISTRAR GASTO</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Onboarding 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

<div class="container" style="max-width: 400px;">

<div class="passos"><span class="feito"></span><span class="feito"></span><span class="feito"></span><span class=""></span></div>
<h2 class="mb-1">Como a mesada é dividida?</h2>
<p class="text-muted mb-4">Passo 3 de 4 · A soma precisa dar 100%.</p>
<div class="card-bege">
    <div class="d-flex justify-content-between"><strong class="text-marrom">🐷 Guardar (metas)</strong><strong id="rot-g" class="text-marrom">50%</strong></div>
    <input type="range" class="form-range range-pct" min="0" max="100" step="5" value="50" data-rotulo="rot-g">
</div><div class="card-bege">
    <div class="d-flex justify-content-between"><strong class="text-marrom">🛒 Gastar (dia a dia)</strong><strong id="rot-s" class="text-marrom">30%</strong></div>
    <input type="range" class="form-range range-pct" min="0" max="100" step="5" value="30" data-rotulo="rot-s">
</div><div class="card-bege">
    <div class="d-flex justify-content-between"><strong class="text-marrom">🎈 Livre (sem prestar contas)</strong><strong id="rot-l" class="text-marrom">20%</strong></div>
    <input type="range" class="form-range range-pct" min="0" max="100" step="5" value="20" data-rotulo="rot-l">
</div><p class="text-center mb-4" id="total-pct">Total: 100%</p>
<button id="btn-salvar-pct" class="btn btn-laranja" data-destino="onboarding-resp-4.html">CONTINUAR</button>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/paginas.js"></script>
</body>
</html>

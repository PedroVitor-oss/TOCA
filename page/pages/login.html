<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container" style="max-width: 400px;">
        <!-- Topo Marrom -->
        <div class="header-marrom-top mb-4 shadow-sm">
            <h2 class="text-white mb-0">Bem vindo<br>de volta</h2>
        </div>

        <form id="form-login" action="dashboard-responsavel.html" class="px-3">
            <div class="mb-3">
                <label class="form-label text-marrom">E-mail</label>
                <input type="email" class="form-control form-control-custom" placeholder="pai@mail.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-marrom">Senha</label>
                <input type="password" class="form-control form-control-custom" placeholder="Sua senha..." required>
            </div>
            
            <button type="submit" class="btn btn-laranja mb-3">Entrar</button>
            <div class="text-center">
                <a id="link-criar-conta" href="cadastro-responsavel.html" class="text-decoration-none text-marrom fw-bold">Criar conta</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/paginas.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Quiz Rápido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="fundo-modal">


<div class="sheet">
    <span class="emoji-topo">🤔</span>
    <h4 class="text-center mb-3">Esse gasto te aproxima da sua meta?</h4>
    <button class="opcao-quiz" data-certa="false">👍 Sim, me aproxima</button>
    <button class="opcao-quiz" data-certa="true">🤷 Não, mas eu quero mesmo assim</button>
    <button class="opcao-quiz" data-certa="false">⏳ Prefiro esperar um pouco</button>
    <div id="feedback-quiz" class="d-none mt-3">
        <div class="alert alert-success">Não existe resposta errada! O importante é decidir sabendo o efeito na meta. 🌟</div>
        <button class="btn btn-laranja mb-2" onclick="redirecionar('sucesso.html?titulo=Gasto%20registrado&msg=Anotado%20no%20seu%20extrato.&destino=dashboard-filho.html')">CONTINUAR</button>
        <div class="text-center"><a href="pedir-aprovacao.html" class="link-marrom">Esse gasto é grande? Pedir aprovação</a></div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>

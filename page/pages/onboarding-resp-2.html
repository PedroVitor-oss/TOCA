<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Onboarding 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

<div class="container" style="max-width: 400px;">

<div class="passos"><span class="feito"></span><span class="feito"></span><span class=""></span><span class=""></span></div>
<h2 class="mb-1">Configure a mesada</h2>
<p class="text-muted mb-4">Passo 2 de 4 · Você pode mudar depois em Configurações.</p>
<form action="onboarding-resp-3.html">
    <div class="mb-3">
    <label class="form-label text-marrom">Valor da mesada (R$)</label>
    <input type="text" class="form-control form-control-custom dinheiro" placeholder="150,00" inputmode="decimal" required>
</div>
    <div class="mb-3">
        <label class="form-label text-marrom">Periodicidade</label>
        <div class="d-flex gap-2" data-grupo>
            <span class="chip-opcao">Semanal</span><span class="chip-opcao">Quinzenal</span><span class="chip-opcao ativo">Mensal</span>
        </div>
    </div>
    <div class="mb-4">
        <label class="form-label text-marrom">Dia do pagamento</label>
        <select class="form-select form-control-custom">
            <option>Dia 1</option><option selected>Dia 5</option><option>Dia 10</option><option>Dia 15</option><option>Dia 20</option>
        </select>
    </div>
    <button type="submit" class="btn btn-laranja">CONTINUAR</button>
</form>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/paginas.js"></script>
</body>
</html>

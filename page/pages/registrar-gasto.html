<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Registrar Gasto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* CSS específico para a tela escura */
        body { background-color: var(--marrom-escuro); color: white; }
        .header-escuro { background-color: #2b1a0e; padding: 15px; display: flex; align-items: center; }
        .input-escuro { background-color: #5a3d29; border: 1px solid #7a553b; color: white; }
        .input-escuro:focus { background-color: #5a3d29; color: white; border-color: var(--laranja-primario); box-shadow: none; }
        .categoria-btn { background-color: #5a3d29; border: 1px solid #7a553b; color: white; border-radius: 15px; padding: 15px; text-align: center; }
        .categoria-btn.ativo { border: 2px solid var(--laranja-primario); background-color: #7a553b; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header-escuro">
        <a href="javascript:history.back()" class="text-white text-decoration-none fs-4 me-3">✕</a>
        <h5 class="mb-0 fw-bold">REGISTRAR GASTO</h5>
    </div>

    <!-- Valor Principal -->
    <div class="text-center py-4" style="background-color: var(--laranja-primario);">
        <div class="d-flex justify-content-center align-items-center gap-2"><span class="fs-3 text-white">R$</span><input type="text" inputmode="decimal" id="valor" class="dinheiro display-4 fw-bold text-white bg-transparent border-0 text-center" style="width: 200px; outline: none;" placeholder="0,00"></div>
    </div>

    <div class="container mt-4" style="max-width: 400px;">
        <!-- Aviso -->
        <div class="alert alert-danger d-flex align-items-center" id="aviso" role="alert" style="background-color: #4a1c1c; border-color: #a33; color: #ffb3b3;">
            <span class="me-2 fs-4">⚠️</span>
            <div><strong>Aviso:</strong> <span id="aviso-texto">Isso atrasa sua meta em X dias</span></div>
        </div>

        <h5 class="mb-3">Categoria</h5>
        <div class="d-flex gap-2 mb-4 overflow-auto pb-2" data-grupo>
            <div class="categoria-btn flex-shrink-0" style="width: 100px;">
                <div class="fs-3">🍰</div>
                <small>DOCES</small>
            </div>
            <div class="categoria-btn ativo flex-shrink-0" style="width: 100px;">
                <div class="fs-3">🍕</div>
                <small>ALIMENTO</small>
            </div>
            <div class="categoria-btn flex-shrink-0" style="width: 100px;">
                <div class="fs-3">🥤</div>
                <small>BEBIDA</small>
            </div>
        </div>

        <!-- Formulário -->
        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <input type="text" id="descricao" class="form-control input-escuro" placeholder="Descrição...">
        </div>
        <div class="mb-4">
            <label class="form-label">Data</label>
            <input id="data" type="date" class="form-control input-escuro">
        </div>

        <button id="btn-confirmar" class="btn btn-laranja mb-5">CONFIRMAR GASTO</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/paginas.js"></script>
</body>
</html>

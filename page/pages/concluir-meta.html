<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Concluir Meta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

<div class="container" style="max-width: 400px;">

<div class="topbar">
    <a href="minha-meta.html" class="voltar">←</a>
    <h4>Concluir meta</h4>
    
</div>
<div class="card-bege text-center"><div style="font-size: 3.5rem;">🎉</div><h3 class="mb-0">Você chegou lá!</h3><p class="mb-0">Confirme a compra do seu 🎧 Fone de ouvido.</p></div>
<form>
    <div class="mb-3">
    <label class="form-label text-marrom">Valor pago (R$)</label>
    <input type="text" class="form-control form-control-custom dinheiro" placeholder="" value="900,00" inputmode="decimal">
</div>
    <div class="mb-3">
    <label class="form-label text-marrom">Onde comprou?</label>
    <input type="text" class="form-control form-control-custom" placeholder="Ex.: Loja do shopping" >
</div>
    <div class="mb-3">
    <label class="form-label text-marrom">Data da compra</label>
    <input type="date" class="form-control form-control-custom" placeholder="" value="2024-02-03" >
</div>
    <button type="button" class="btn btn-laranja"  data-destino="compartilhar-conquista.html">CONFIRMAR COMPRA</button>
</form>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/paginas.js"></script>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Primeira Meta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

<div class="container" style="max-width: 400px;">

<div class="passos"><span class="feito"></span><span class="feito"></span><span class="feito"></span></div>
<h2 class="mb-1">Qual é o seu primeiro sonho?</h2>
<p class="text-muted mb-4">Seu responsável vai ver e aprovar a meta.</p>
<form action="sucesso.html?titulo=Meta%20enviada%21&msg=Agora%20%C3%A9%20s%C3%B3%20esperar%20seu%20respons%C3%A1vel%20aprovar.&destino=dashboard-filho.html">
    <div class="mb-3">
        <label class="form-label text-marrom">Escolha um ícone</label>
        <div class="d-flex gap-2 flex-wrap" data-grupo>
            <span class="avatar-opcao ativo">🎧</span><span class="avatar-opcao">🎮</span><span class="avatar-opcao">🚲</span><span class="avatar-opcao">👟</span><span class="avatar-opcao">📱</span>
        </div>
    </div>
    <div class="mb-3">
    <label class="form-label text-marrom">O que você quer comprar?</label>
    <input type="text" class="form-control form-control-custom" placeholder="Ex.: Fone de ouvido" required>
</div>
    <div class="mb-3">
    <label class="form-label text-marrom">Quanto custa? (R$)</label>
    <input type="text" class="form-control form-control-custom dinheiro" placeholder="900,00" inputmode="decimal" required>
</div>
    <div class="mb-3">
    <label class="form-label text-marrom">Até quando?</label>
    <input type="date" class="form-control form-control-custom" placeholder="" required>
</div>
    <button type="button" class="btn btn-laranja" onclick="redirecionar('sucesso.html?titulo=Meta%20enviada%21&msg=Agora%20%C3%A9%20s%C3%B3%20esperar%20seu%20respons%C3%A1vel%20aprovar.&destino=dashboard-filho.html')">ENVIAR MINHA META</button>
</form>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>

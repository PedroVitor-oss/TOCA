<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Permissões do Filho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

<div class="container" style="max-width: 400px;">

<div class="topbar">
    <a href="gerenciar-membros.html" class="voltar">←</a>
    <h4>Permissões do John</h4>
    
</div>
<p class="text-muted">Defina o que ele faz sozinho e o que precisa da sua aprovação.</p>
<div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-3">
    <label class="form-check-label" for="p1"><strong class="text-marrom">Registrar gastos pequenos</strong><small class='text-muted d-block'>Até R$ 20,00 sem pedir aprovação</small></label>
    <input class="form-check-input ms-3 mt-0" type="checkbox" role="switch" id="p1" checked style="width: 3em; height: 1.5em;">
</div>
<div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-3">
    <label class="form-check-label" for="p2"><strong class="text-marrom">Criar metas sozinho</strong><small class='text-muted d-block'>Se desligado, toda meta precisa de aprovação</small></label>
    <input class="form-check-input ms-3 mt-0" type="checkbox" role="switch" id="p2" style="width: 3em; height: 1.5em;">
</div>
<div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-3">
    <label class="form-check-label" for="p3"><strong class="text-marrom">Alterar prazo da meta</strong></label>
    <input class="form-check-input ms-3 mt-0" type="checkbox" role="switch" id="p3" style="width: 3em; height: 1.5em;">
</div>
<div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-3">
    <label class="form-check-label" for="p4"><strong class="text-marrom">Ver regra de porcentagens</strong></label>
    <input class="form-check-input ms-3 mt-0" type="checkbox" role="switch" id="p4" checked style="width: 3em; height: 1.5em;">
</div>
<div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-3">
    <label class="form-check-label" for="p5"><strong class="text-marrom">Participar do ranking de consistência</strong><small class='text-muted d-block'>Opcional · mostra constância, nunca valores</small></label>
    <input class="form-check-input ms-3 mt-0" type="checkbox" role="switch" id="p5" style="width: 3em; height: 1.5em;">
</div>
<div class="mb-4">
    <label class="form-label text-marrom">Limite sem aprovação (R$)</label>
    <input type="number" class="form-control form-control-custom" value="20">
</div>
<button class="btn btn-laranja" onclick="redirecionar('sucesso.html?titulo=Permiss%C3%B5es%20salvas&msg=As%20novas%20regras%20j%C3%A1%20valem%20para%20o%20John.&destino=gerenciar-membros.html')">SALVAR</button>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>

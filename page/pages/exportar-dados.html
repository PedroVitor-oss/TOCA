<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Exportar Dados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="fundo-modal">


<div class="sheet">
    <a href="javascript:history.back()" class="fechar">✕</a>
    <span class="emoji-topo">📤</span>
    <h3 class="text-center mb-3">Exportar dados</h3>
    <label class="form-label text-marrom">O que exportar?</label>
    <div class="d-flex gap-2 flex-wrap mb-3" data-grupo data-multiplo="true">
        <span class="chip-opcao ativo">Extrato</span><span class="chip-opcao ativo">Metas</span><span class="chip-opcao">Relatórios</span>
    </div>
    <label class="form-label text-marrom">Formato</label>
    <div class="d-flex gap-2 mb-3" data-grupo><span class="chip-opcao">JSON</span><span class="chip-opcao ativo">CSV</span></div>
    <label class="form-label text-marrom">Período</label>
    <select class="form-select form-control-custom mb-4"><option>Este mês</option><option>Últimos 3 meses</option><option>Este ano</option><option>Tudo</option></select>
    <button class="btn btn-laranja" >EXPORTAR</button>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/paginas.js"></script>
</body>
</html>

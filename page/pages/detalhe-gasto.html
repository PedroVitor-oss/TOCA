<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Detalhe de Gasto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

<div class="container" style="max-width: 400px;">

<div class="topbar">
    <a href="extrato-familiar.html" class="voltar">←</a>
    <h4>Detalhe do gasto</h4>
    
</div>
<div class="card-bege text-center py-4">
    <div style="font-size: 3rem;">🍕</div>
    <h1 class="valor-neg mb-0">- R$ 35,00</h1>
    <span class="selo selo-laranja">Alimento</span>
</div>
<div class="card-toca">
    <div class="d-flex justify-content-between mb-2"><span class="text-muted">Descrição</span><strong>Pizza com amigos</strong></div>
    <div class="d-flex justify-content-between mb-2"><span class="text-muted">Data</span><strong>03/02/2024</strong></div>
    <div class="d-flex justify-content-between mb-2"><span class="text-muted">Quem registrou</span><strong>John</strong></div>
    <div class="d-flex justify-content-between"><span class="text-muted">Situação</span><span class="selo selo-verde">Aprovado</span></div>
</div>
<label class="form-label text-marrom">Comentário</label>
<textarea class="form-control form-control-custom mb-3" rows="3" placeholder="Ex.: Boa escolha, John!"></textarea>
<div class="d-grid gap-2">
    <button class="btn btn-laranja" onclick="redirecionar('sucesso.html?titulo=Coment%C3%A1rio%20salvo&msg=John%20vai%20ver%20seu%20recado.&destino=extrato-familiar.html')">SALVAR COMENTÁRIO</button>
    <button class="btn btn-vermelho-outline" onclick="redirecionar('confirmacao.html?titulo=Excluir%20lan%C3%A7amento%3F&msg=Esse%20gasto%20ser%C3%A1%20removido%20do%20extrato.&destino=extrato-familiar.html')">EXCLUIR</button>
</div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>

</html>

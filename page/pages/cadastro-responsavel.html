<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Cadastro Responsável</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

<div class="container" style="max-width: 400px;">

<h2 class="text-center mb-4">Vamos criar<br>sua conta</h2>
<form id="form-cadastro" action="onboarding-resp-1.html" class="px-3">
    <div class="mb-3">
    <label class="form-label text-marrom">Nome</label>
    <input type="text" class="form-control form-control-custom" placeholder="" required>
</div>
    <div class="mb-3">
    <label class="form-label text-marrom">E-mail</label>
    <input type="email" class="form-control form-control-custom" placeholder="" required>
</div>
    <div class="mb-3">
    <label class="form-label text-marrom">Senha</label>
    <input type="password" class="form-control form-control-custom" placeholder="" required>
</div>
    <div class="mb-3">
    <label class="form-label text-marrom">Confirmar Senha</label>
    <input type="password" class="form-control form-control-custom" placeholder="" required>
</div>
    <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="termos" required>
        <label class="form-check-label text-marrom" for="termos">Concordo com os <a href="#" class="text-marrom">Termos de Uso</a> e a Política de Privacidade (LGPD)</label>
    </div>
    <button type="submit" class="btn btn-laranja">CRIAR CONTA</button>
    <div class="text-center mt-3"><a href="login.html" class="link-marrom">Já tenho conta</a></div>
</form>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/paginas.js"></script>
</body>
</html>

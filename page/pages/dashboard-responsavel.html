<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Responsável</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

    <div class="container" style="max-width: 400px;">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 px-2">
            <h3 class="mb-0">Olá, João</h3>
            <div class="fs-5">
                <i class="bi bi-bell me-2"></i> <!-- Requer Bootstrap Icons, mas pode usar emojis -->
                <span>🔔</span>
                <span>🔍</span>
            </div>
        </div>

        <!-- Cards de Saldo -->
        <div class="row g-2 mb-4 px-2">
            <div class="col-6">
                <div class="card-saldo">
                    <h5>Saldo</h5>
                    <p>R$ 1200,00</p>
                </div>
            </div>
            <div class="col-6">
                <div class="card-saldo">
                    <h5>Já gasto</h5>
                    <p>R$ 200,00</p>
                </div>
            </div>
        </div>

        <div class="px-2">
            <button class="btn btn-laranja mb-4" onclick="redirecionar('registrar-gasto.html')">ADICIONAR GASTO</button>

            <h5 class="fw-bold mb-3 text-marrom">Atalhos Rápidos</h5>
            <div class="d-flex justify-content-between mb-4 text-center">
                <div><div class="bg-white p-2 rounded-3 border">📄</div><small>Extrato</small></div>
                <div><div class="bg-white p-2 rounded-3 border">📈</div><small>Meta</small></div>
                <div><div class="bg-white p-2 rounded-3 border">👨‍👩‍👧</div><small>Filhos</small></div>
                <div><div class="bg-white p-2 rounded-3 border">👤</div><small>Perfil</small></div>
            </div>

            <h5 class="fw-bold mb-3 text-marrom">O que você precisa?</h5>
            <input type="text" class="form-control form-control-custom" placeholder="Pesquisar...">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>

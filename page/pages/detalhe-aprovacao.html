<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOCA - Detalhe de Aprovação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-4">

<div class="container" style="max-width: 400px;">

<div class="topbar">
    <a href="central-aprovacoes.html" class="voltar">←</a>
    <h4>Pedido de aprovação</h4>
    
</div>
<div class="card-bege text-center py-4">
    <div class="avatar avatar-grande">🦊</div>
    <strong class="text-marrom">John quer gastar</strong>
    <h1 class="mb-0">R$ 50,00</h1>
    <span class="selo selo-laranja">Alimento</span>
</div>
<div class="card-toca">
    <strong class="text-marrom">Motivo</strong>
    <p class="mb-0">“Vou lanchar com meus amigos depois da aula.”</p>
</div>
<div class="alert alert-warning">⚠️ Esse gasto atrasa a meta do fone em 6 dias.</div>
<label class="form-label text-marrom">Comentário para o John (opcional)</label>
<textarea class="form-control form-control-custom mb-3" rows="2"></textarea>
<div class="d-grid gap-2">
    <button class="btn btn-verde" onclick="redirecionar('sucesso.html?titulo=Gasto%20aprovado&msg=John%20foi%20avisado%20agora%20mesmo.&destino=painel-filho.html')">APROVAR</button>
    <button class="btn btn-vermelho-outline" onclick="redirecionar('sucesso.html?titulo=Gasto%20recusado&msg=John%20foi%20avisado%20agora%20mesmo.&destino=painel-filho.html')">RECUSAR</button>
</div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
